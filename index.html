<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Briggite</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9acb, #c77dff, #8ec5fc);
            color: white;
        }

        .contenedor {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 25px;
            width: 90%;
            max-width: 450px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .boton {
            display: block;
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,0.25);
            padding: 15px;
            margin: 12px 0;
            border-radius: 15px;
            font-size: 18px;
            transition: 0.3s;
        }

        .boton:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.4);
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>BRIGGITE</h1>

        <p>✨ Bienvenida a mi página ✨</p>

        <a class="boton"
           href="https://www.instagram.com/its_brigittes/"
           target="_blank">
            📸 Instagram
        </a>

        <a class="boton"
           href="https://www.tiktok.com/@brillitos_16"
           target="_blank">
            🎵 TikTok
        </a>

        <a class="boton"
           href="https://wa.me/593969364836"
           target="_blank">
            💬 WhatsApp
        </a>

    </div>

</body>
</html>
